name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - run: dotnet tool restore
      - run: dotnet restore MeshSMO.Sensors.slnx
      # JavaScript SDK intentionally skips npm install in CI, so install the
      # frontend dependencies before dotnet build invokes its BuildCommand.
      - run: npm ci
        working-directory: src/web
      - run: dotnet build MeshSMO.Sensors.slnx --configuration Release --no-restore
      - run: dotnet test MeshSMO.Sensors.slnx --configuration Release --no-build --logger "trx;LogFileName=dotnet-tests.trx"
      - run: dotnet run --project src/MeshSMO.Sensors.DbMigrator --configuration Release --no-build -- --validate-registry
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dotnet-test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - run: npm ci
        working-directory: src/web
      - run: npm run lint
        working-directory: src/web
      - run: npm run typecheck
        working-directory: src/web
      - run: npm run build
        working-directory: src/web

  # Проверка сборки образов на PR и push; результат кэшируется в scope image-*
  # и переиспользуется джобами публикации.
  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [web, gateway, dbmigrator]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.${{ matrix.image }}
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=image-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.image }}

  # Rolling-публикация: каждый push в основную ветку обновляет
  # ghcr.io/meshsmo/meshsmo-sensors-<image>:<branch> и :sha-<hash>.
  publish-rolling:
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: [dotnet, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [web, gateway, dbmigrator]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/meshsmo/meshsmo-sensors-${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.${{ matrix.image }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=image-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.image }}
