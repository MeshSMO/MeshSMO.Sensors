name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Scan Git history for secrets
        run: >-
          docker run --rm
          -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --config=/repo/gitleaks.toml --redact --verbose

  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x
      - name: Install ML.NET native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libomp5
          omp_path="$(find /usr/lib -name libomp.so.5 -print -quit)"
          test -n "$omp_path"
          test -e "$(dirname "$omp_path")/libiomp5.so" || \
            sudo ln -s "$(basename "$omp_path")" "$(dirname "$omp_path")/libiomp5.so"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - run: dotnet tool restore
      - run: dotnet restore MeshSMO.Sensors.slnx
      # JavaScript SDK intentionally skips npm install in CI, so install the
      # frontend dependencies before dotnet build invokes its BuildCommand.
      - run: npm ci
        working-directory: src/web
      - run: dotnet build MeshSMO.Sensors.slnx --configuration Release --no-restore
      - run: dotnet test MeshSMO.Sensors.slnx --configuration Release --no-build --logger "trx;LogFileName=dotnet-tests.trx"
      # Registry YAMLs are deployment-local (gitignored), so there is nothing
      # committed to validate; the registry is validated on every
      # gateway/dbmigrator start instead.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: dotnet-test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - run: npm ci
        working-directory: src/web
      - run: npm run lint
        working-directory: src/web
      - run: npm run format:check
        working-directory: src/web
      - run: npm run typecheck
        working-directory: src/web
      - run: npm run build
        working-directory: src/web

  # PR проверяет сборку образов, читая cache основной ветки, но ничего не
  # экспортирует в refs/pull/*: после merge такой cache больше не используется.
  # На push образы один раз собирает и публикует publish-rolling ниже.
  docker:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # ML.NET TimeSeries currently ships libMklImports only for linux-x64.
          - image: web
            platforms: linux/amd64
          - image: gateway
            platforms: linux/amd64,linux/arm64
          - image: dbmigrator
            platforms: linux/amd64,linux/arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4
        if: contains(matrix.platforms, 'linux/arm64')
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: deploy/Dockerfile.${{ matrix.image }}
          platforms: ${{ matrix.platforms }}
          push: false
          cache-from: type=gha,scope=image-${{ matrix.image }}

  # Rolling-публикация: каждый push в основную ветку обновляет
  # ghcr.io/meshsmo/meshsmo-sensors-<image>:<branch> и :sha-<hash>.
  # Это единственный writer BuildKit cache: один scope на runtime-образ.
  publish-rolling:
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: [dotnet, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep this in sync with the PR build matrix above.
          - image: web
            platforms: linux/amd64
          - image: gateway
            platforms: linux/amd64,linux/arm64
          - image: dbmigrator
            platforms: linux/amd64,linux/arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4
        if: contains(matrix.platforms, 'linux/arm64')
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ghcr.io/meshsmo/meshsmo-sensors-${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: deploy/Dockerfile.${{ matrix.image }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=image-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.image }}
