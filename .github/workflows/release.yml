name: Release

# Релиз по тегу: тесты -> публикация версионированных образов в ghcr.io
# -> GitHub Release с автосгенерированными notes.
# workflow_dispatch без тега переопубликует только :latest из текущей ветки.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gate:
    uses: ./.github/workflows/ci.yml
    # GitHub валидирует permissions вложенного workflow на старте: ci.yml
    # содержит publish-rolling с packages: write, поэтому caller обязан
    # предоставить их, иначе ран падает с startup_failure. Сам publish-rolling
    # здесь не выполняется: его if требует refs/heads/main|master.
    permissions:
      contents: read
      packages: write

  publish-images:
    needs: quality-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # ML.NET TimeSeries currently ships libMklImports only for linux-x64.
          - image: web
            platforms: linux/amd64
            description: >-
              Public telemetry site for MeshSMO Sensors: ASP.NET Core BFF
              (API v1) with a prerendered TanStack Start frontend.
          - image: gateway
            platforms: linux/amd64,linux/arm64
            description: >-
              Telemetry gateway for MeshSMO Sensors: polls pull-only
              MeshCore/LoRa sensor nodes via the repeater and buffers batches
              in a SQLite outbox.
          - image: dbmigrator
            platforms: linux/amd64,linux/arm64
            description: >-
              One-shot migrator for MeshSMO Sensors: applies EF Core
              migrations and syncs the YAML sensor registry into PostgreSQL.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4
        if: contains(matrix.platforms, 'linux/arm64')
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ghcr.io/meshsmo/meshsmo-sensors-${{ matrix.image }}
          # Описание образа: без явного labels metadata-action выдаёт пустой
          # org.opencontainers.image.description, который перекрывает LABEL из
          # Dockerfile. latest добавляется flavor'ом latest=auto по умолчанию.
          labels: |
            org.opencontainers.image.description=${{ matrix.description }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: deploy/Dockerfile.${{ matrix.image }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Аннотации манифеста (manifest:key=value): именно их показывает
          # страница пакета GHCR для multi-arch образов (LABEL в Dockerfile
          # ложится только в конфиг платформенных образов).
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=image-${{ matrix.image }}

  github-release:
    needs: publish-images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes --title "${GITHUB_REF_NAME}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
