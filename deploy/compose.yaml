name: meshsmo-sensors

services:
  sensor-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meshsmo_sensors}
      POSTGRES_USER: ${POSTGRES_USER:-meshsmo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - sensor-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  sensor-migrator:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.dbmigrator
    environment:
      ConnectionStrings__Sensors: Host=sensor-db;Port=5432;Database=${POSTGRES_DB:-meshsmo_sensors};Username=${POSTGRES_USER:-meshsmo};Password=${POSTGRES_PASSWORD}
      Registry__Directory: config/sensors
    # mesh.loginPassword в config/sensors/*.yaml может ссылаться на переменные из .env (${NODE_..._PASSWORD})
    env_file:
      - path: .env
        required: false
    volumes:
      # Реестр датчиков — deployment-local (в git не хранится), маунтим с хоста
      - ../config:/app/config:ro
    depends_on:
      sensor-db:
        condition: service_healthy
    restart: "no"

  sensor-web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    environment:
      ConnectionStrings__Sensors: Host=sensor-db;Port=5432;Database=${POSTGRES_DB:-meshsmo_sensors};Username=${POSTGRES_USER:-meshsmo};Password=${POSTGRES_PASSWORD}
      Public__BaseUrl: ${PUBLIC_BASE_URL:-https://sensors.meshsmo.ru}
      Forecasting__Enabled: ${FORECASTING_ENABLED:-false}
      Forecasting__MinimumHistoryDaysByHorizon__1h: ${FORECASTING_MINIMUM_HISTORY_1H_DAYS:-3}
      Forecasting__MinimumHistoryDaysByHorizon__6h: ${FORECASTING_MINIMUM_HISTORY_6H_DAYS:-3}
      Forecasting__MinimumHistoryDaysByHorizon__12h: ${FORECASTING_MINIMUM_HISTORY_12H_DAYS:-5}
      Forecasting__MinimumHistoryDaysByHorizon__24h: ${FORECASTING_MINIMUM_HISTORY_24H_DAYS:-7}
      Gateway__Mode: ${GATEWAY_MODE:-Pull}
      Gateway__BaseUrl: ${GATEWAY_BASE_URL:-http://sensor-gateway:8080}
      Gateway__ApiKey: ${GATEWAY_API_KEY:-}
      Gateway__Ingest__ApiKey: ${GATEWAY_INGEST_API_KEY:-}
    depends_on:
      sensor-migrator:
        condition: service_completed_successfully
    ports:
      - "${SENSOR_WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  sensor-gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gateway
    restart: unless-stopped
    environment:
      Gateway__ApiKey: ${GATEWAY_API_KEY:-}
      Push__ApiUrl: ${GATEWAY_PUSH_API_URL:-}
      Push__ApiKey: ${GATEWAY_PUSH_API_KEY:-}
      Push__IntervalSeconds: ${GATEWAY_PUSH_INTERVAL_SECONDS:-15}
      Push__AllowInsecureHttp: ${GATEWAY_PUSH_ALLOW_INSECURE_HTTP:-false}
      MeshCore__Mode: ${MESHCORE_MODE:-Disabled}
      MeshCore__ReconnectDelaySeconds: 5
      MeshCore__TelemetryCollectionEnabled: ${MESHCORE_TELEMETRY_COLLECTION_ENABLED:-false}
      MeshCore__TelemetryCollectionIntervalSeconds: 60
      MeshCore__Http__BaseAddress: ${MESHCORE_HTTP_BASE_ADDRESS:-}
      MeshCore__Http__AdminPassword: ${MESHCORE_HTTP_ADMIN_PASSWORD:-}
      MeshCore__Http__AllowInvalidServerCertificate: ${MESHCORE_HTTP_ALLOW_INVALID_CERTIFICATE:-false}
      MeshCore__Serial__PortName: /dev/meshcore
      MeshCore__Serial__BaudRate: 115200
      MeshCore__Companion__Host: ${MESHCORE_COMPANION_HOST:-}
      MeshCore__Companion__Port: ${MESHCORE_COMPANION_PORT:-5000}
      LocalTelemetry__DatabasePath: /app/data/gateway-telemetry.db
      Registry__Directory: /app/config/sensors
      SensorPolling__LoginPassword: ${SENSOR_LOGIN_PASSWORD:-}
      SensorPolling__IntervalOverrideSeconds: ${SENSOR_POLL_INTERVAL_OVERRIDE:-60}
    # Переменные из .env нужны для ${VAR}-подстановки в mesh.loginPassword (config/sensors/*.yaml)
    env_file:
      - path: .env
        required: false
    volumes:
      - sensor-gateway-data:/app/data
      - ../config:/app/config:ro
    healthcheck:
      # Ready = локальные ресурсы (SQLite outbox, YAML registry). Недоступность
      # LoRa-датчиков или репитера не должна ронять health (см. спеку §36).
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  sensor-db-data:
  sensor-gateway-data:
